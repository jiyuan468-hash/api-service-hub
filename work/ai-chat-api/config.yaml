# AI Chat API Configuration

auth:
  api_key: "your-api-key-here"  # Change this in production!
  # Or set via env: ENV API_KEY=xxx

rate_limit:
  max_requests_per_minute: 30
  enabled: true

# Providers configuration - add your API keys below
providers:
  openai:
    endpoint: "https://api.openai.com/v1/chat/completions"
    api_key: ""  # Set OPENAI_API_KEY environment variable or put key here
    models: ["gpt-4", "gpt-4o", "gpt-3.5-turbo"]
    default_model: "gpt-3.5-turbo"

  anthropic:
    endpoint: "https://api.anthropic.com/v1/messages"
    api_key: ""  # Set ANTHROPIC_API_KEY environment variable or put key here
    models: ["claude-3-opus", "claude-3-sonnet", "claude-3-haiku"]
    default_model: "claude-3-haiku"

  ollama:
    endpoint: "http://localhost:11434/api/chat"
    api_key: ""  # Ollama doesn't need API key
    models: ["llama3", "qwen2.5", "mistral"]
    default_model: "llama3"

deployment:
  host: "0.0.0.0"
  port: 8000
  workers: 4
